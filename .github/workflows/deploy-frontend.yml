name: "Deploy Frontend"
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]

env:
  AWS_REGION:        ${{ vars.AWS_REGION || 'us-east-1' }}
  FRONTEND_ASG_NAME: ${{ vars.FRONTEND_ASG_NAME || 'prod-frontend-asg' }}
  NODE_VERSION:      "20"

jobs:
  # ─── Build ────────────────────────────────────────────────────────────────
  build-frontend:
    name: "Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check required packages are installed
        run: |
          echo "Verifying react-joyride is in package.json..."
          grep -q "react-joyride" package.json || {
            echo "  react-joyride not in package.json — adding it now"
            npm install react-joyride --save
          }
          echo " Dependency check passed"

      - name: Build React app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
          NODE_ENV:     production
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist         || (echo " dist/ directory missing" && exit 1)
          test -f dist/index.html || (echo " dist/index.html missing" && exit 1)
          echo " Build succeeded"
          echo "dist/ contents:"
          ls -lah dist/
          du -sh dist/

      # Upload build artifact — kept for 5 days as rollback option
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 5

  # ─── Deploy via ASG Instance Refresh ──────────────────────────────────────
  deploy-frontend:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}
      url:  ${{ vars.FRONTEND_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Verify ASG exists
        run: |
          ASG=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.FRONTEND_ASG_NAME }}" \
            --query 'AutoScalingGroups[0].AutoScalingGroupName' \
            --output text 2>/dev/null || echo "None")
          if [ "$ASG" = "None" ] || [ -z "$ASG" ]; then
            echo " ASG '${{ env.FRONTEND_ASG_NAME }}' not found."
            echo "   Run the Terraform workflow first to create infrastructure."
            exit 1
          fi
          DESIRED=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.FRONTEND_ASG_NAME }}" \
            --query 'AutoScalingGroups[0].DesiredCapacity' \
            --output text)
          echo " ASG found — Desired capacity: $DESIRED"

      - name: Cancel any in-progress instance refresh
        run: |
          # If a refresh is already running, cancel it before starting a new one
          ACTIVE=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "${{ env.FRONTEND_ASG_NAME }}" \
            --query 'InstanceRefreshes[?Status==`InProgress`].InstanceRefreshId' \
            --output text 2>/dev/null || echo "")
          if [ -n "$ACTIVE" ] && [ "$ACTIVE" != "None" ]; then
            echo "Cancelling in-progress refresh: $ACTIVE"
            aws autoscaling cancel-instance-refresh \
              --auto-scaling-group-name "${{ env.FRONTEND_ASG_NAME }}" || true
            sleep 15
          fi

      - name: Trigger ASG Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ env.FRONTEND_ASG_NAME }}" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 240,
              "CheckpointPercentages": [50, 100],
              "CheckpointDelay": 30
            }' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo " Instance refresh started: $REFRESH_ID"

      - name: Wait for Instance Refresh to complete
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          ASG_NAME="${{ env.FRONTEND_ASG_NAME }}"
          MAX_WAIT=900   # 15 minutes (frontend instances boot faster)
          ELAPSED=0
          INTERVAL=20

          echo "Polling refresh $REFRESH_ID every ${INTERVAL}s (max ${MAX_WAIT}s)..."

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RESPONSE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0]' \
              --output json)

            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['Status'])")
            PCT=$(echo "$RESPONSE"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('PercentageComplete',0))")

            echo "[$ELAPSED s] Status: $STATUS | ${PCT}% complete"

            case "$STATUS" in
              Successful)
                echo " Instance refresh completed"
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed)
                REASON=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('StatusReason','unknown'))")
                echo " Instance refresh $STATUS: $REASON"
                exit 1
                ;;
            esac

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo " Timed out waiting for instance refresh"
          exit 1

      - name: Verify frontend health
        run: |
          HEALTH_URL="${{ vars.FRONTEND_HEALTH_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            echo "  FRONTEND_HEALTH_URL not set — skipping"
            exit 0
          fi
          echo "Checking $HEALTH_URL ..."
          for i in $(seq 1 6); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i/6: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo " Frontend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo " Frontend health check failed"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### Frontend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ASG | ${{ env.FRONTEND_ASG_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Refresh ID | ${{ steps.refresh.outputs.refresh_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ vars.FRONTEND_HEALTH_URL }} |" >> $GITHUB_STEP_SUMMARY
