name: "Terraform Infrastructure"
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches: [main]
    paths:
      - "terraform/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [init, plan, apply, destroy]
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]

env:
  TF_VERSION:     "1.7.5"
  TF_WORKING_DIR: "./Terraform"
  AWS_REGION:     "us-east-1"

jobs:
  terraform-plan:
    name: "Plan"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -detailed-exitcode \
            -out=tfplan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=${{ github.event.inputs.environment || 'prod' }}" \
            -var="domain_name=${{ secrets.TF_VAR_DOMAIN_NAME }}" \
            -var="slack_webhook_url=${{ secrets.TF_VAR_SLACK_WEBHOOK_URL }}" \
            -var="key_name=${{ secrets.TF_VAR_KEY_NAME }}" \
            -var="github_repo_frontend=${{ secrets.TF_VAR_GITHUB_REPO_FRONTEND }}" \
            -var="github_repo_backend=${{ secrets.TF_VAR_GITHUB_REPO_BACKEND }}"
        continue-on-error: true

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            #### Terraform Plan
            - Format: \`${{ steps.fmt.outcome }}\`
            - Init: \`${{ steps.init.outcome }}\`
            - Validate: \`${{ steps.validate.outcome }}\`
            - Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>

            *Pushed by @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         output,
            });

      - name: Terraform Plan Status
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  terraform-apply:
    name: "Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan

    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config="region=${{ env.AWS_REGION }}"

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan

      - name: Export Terraform outputs
        id: outputs
        run: |
          echo "alb_dns=$(terraform output -raw external_alb_dns)"       >> $GITHUB_OUTPUT
          echo "internal_alb=$(terraform output -raw internal_alb_dns)"  >> $GITHUB_OUTPUT
          echo "frontend_asg=$(terraform output -raw frontend_asg_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "backend_asg=$(terraform output -raw backend_asg_name 2>/dev/null || echo '')"   >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### Infrastructure Applied" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| External ALB | ${{ steps.outputs.outputs.alb_dns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment  | ${{ github.event.inputs.environment || 'prod' }} |" >> $GITHUB_STEP_SUMMARY

  terraform-destroy:
    name: "Destroy"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -auto-approve \
            -no-color \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=${{ github.event.inputs.environment || 'prod' }}" \
            -var="domain_name=${{ secrets.TF_VAR_DOMAIN_NAME }}" \
            -var="slack_webhook_url=${{ secrets.TF_VAR_SLACK_WEBHOOK_URL }}" \
            -var="key_name=${{ secrets.TF_VAR_KEY_NAME }}" \
            -var="github_repo_frontend=${{ secrets.TF_VAR_GITHUB_REPO_FRONTEND }}" \
            -var="github_repo_backend=${{ secrets.TF_VAR_GITHUB_REPO_BACKEND }}"
